<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vape Zilla CRM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a; --surface-color: #1e293b; --text-color: #f8fafc;
            --hint-color: #94a3b8; --accent-color: #6366f1; --accent-neon: #818cf8;
            --success-color: #10b981; --danger-color: #ef4444;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 12px; padding-bottom: 90px; }
        .hidden { display: none !important; }
        .card { background: var(--surface-color); border-radius: 14px; padding: 14px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .btn { width: 100%; padding: 14px; background: var(--accent-color); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn.success { background: var(--success-color); }
        .btn.danger { background: var(--danger-color); }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: var(--bg-color); color: #fff; font-size: 15px; box-sizing: border-box; margin-top: 6px; margin-bottom: 12px; outline: none; }
        
        /* Навигация */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: rgba(30,41,59,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .nav-item { color: var(--hint-color); font-size: 12px; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--accent-neon); font-weight: bold; }
        
        /* Каталог */
        .categories { display: flex; overflow-x: auto; gap: 8px; margin-bottom: 12px; padding-bottom: 4px; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--bg-color); color: var(--text-color); border: 1px solid rgba(255,255,255,0.1); padding: 8px 16px; border-radius: 20px; font-size: 14px; white-space: nowrap; cursor: pointer; }
        .cat-btn.active { background: var(--accent-color); border-color: transparent; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .counter { display: flex; align-items: center; gap: 10px; }
        .btn-count { width: 30px; height: 30px; border-radius: 50%; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-count.add { background: var(--accent-color); }
    </style>
</head>
<body>

    <!-- ВКЛАДКА 1: ПРОДАЖИ (КАТАЛОГ) -->
    <div id="tab-sales" class="tab-content">
        <h2>🛍 Каталог и Продажи</h2>
        <div class="card">
            <label>Торговая точка смены:</label>
            <select id="sale-branch-select"></select>
            <button class="btn success" style="margin-bottom:12px;" onclick="openShift()">Открыть смену здесь</button>
        </div>
        
        <div class="card">
            <input type="text" id="search" placeholder="Поиск товара..." oninput="filterCatalog()">
            <div class="categories" id="categories-list"></div>
            <div id="products-list"></div>
        </div>
    </div>

    <!-- ВКЛАДКА 2: ЗАРПЛАТА И УПРАВЛЕНИЕ -->
    <div id="tab-salary" class="tab-content hidden">
        <h2>💰 Зарплата и Управление</h2>
        
        <!-- Блок сотрудника -->
        <div id="emp-salary-block" class="card">
            <h3>Мои финансы за месяц</h3>
            <p>Отработано смен: <b id="e-shifts">0</b></p>
            <p>Продажи: <b id="e-sales">0 ₽</b></p>
            <p>Итого расчетных: <b id="e-total" style="color:var(--success-color);">0 ₽</b></p>
        </div>

        <!-- Блок директора -->
        <div id="dir-salary-block" class="hidden">
            <div class="card">
                <h3>🏬 Управление точками</h3>
                <input type="text" id="new-branch-name" placeholder="Название магазина">
                <button class="btn" onclick="addBranch()">Добавить магазин</button>
                <div id="branches-list" style="margin-top:10px;"></div>
            </div>

            <div class="card">
                <h3>👥 Сотрудники и условия ЗП</h3>
                <label>Имя сотрудника / ID:</label>
                <input type="text" id="cfg-emp-id" placeholder="Telegram ID сотрудника">
                <label>Привязка к точке:</label>
                <select id="cfg-branch-select"></select>
                <label>Тип оплаты:</label>
                <select id="cfg-type" onchange="toggleSalaryInputs()">
                    <option value="fixed">Фикс за смену</option>
                    <option value="shift_percent">Выход + Процент</option>
                </select>
                <div id="div-fixed"><label>Сумма за смену (₽):</label><input type="number" id="cfg-fixed" value="1500"></div>
                <div id="div-percent" class="hidden"><label>Выход за смену (₽):</label><input type="number" id="cfg-shift" value="1000"><label>Процент от продаж (%):</label><input type="number" id="cfg-per" value="5"></div>
                <button class="btn success" onclick="saveEmployeeSettings()">Сохранить настройки сотрудника</button>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА 3: РЕВИЗИЯ -->
    <div id="tab-revision" class="tab-content hidden">
        <h2>🔍 Быстрая Ревизия</h2>
        <div class="card">
            <p style="color:var(--hint-color);">Укажите фактическое наличие товара на складе:</p>
            <div id="revision-list"></div>
            <button class="btn success" onclick="submitRevision()">Подтвердить и обновить остатки</button>
        </div>
    </div>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('sales', this)">🛍<br>Продажи</div>
        <div class="nav-item" onclick="switchTab('salary', this)">💰<br>Зарплата</div>
        <div class="nav-item" onclick="switchTab('revision', this)">🔍<br>Ревизия</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        const DIRECTOR_ID = 7562942752;
        const isDirector = tg.initDataUnsafe?.user?.id === DIRECTOR_ID;

        // Данные (в реальности подтягиваются из базы, здесь базовый шаблон каталога)
        let branches = [{id: 1, name: "Центральный"}, {id: 2, name: "Северный"}];
        let catalog = [
            {id: 1, cat: "Жидкости", name: "Podonki Alfa", price: 500, stock: 15},
            {id: 2, cat: "Одноразки", name: "Vozol Star 1800", price: 1800, stock: 8}
        ];
        let cart = {};
        let currentCategory = "Жидкости";

        if (isDirector) {
            document.getElementById('dir-salary-block').classList.remove('hidden');
            renderDirectorData();
        }

        initSalesTab();
        initRevisionTab();

        function sendData(action, payload) {
            tg.sendData(JSON.stringify({ action, payload }));
            tg.close();
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }

        // --- ПРОДАЖИ ---
        function initSalesTab() {
            const bSel = document.getElementById('sale-branch-select');
            bSel.innerHTML = branches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
            
            const cats = [...new Set(catalog.map(i => i.cat))];
            document.getElementById('categories-list').innerHTML = cats.map((c, idx) => `
                <button class="cat-btn ${idx===0?'active':''}" onclick="selectCat('${c}', this)">${c}</button>
            `).join('');
            filterCatalog();
        }

        function selectCat(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); currentCategory = cat;
            filterCatalog();
        }

        function filterCatalog() {
            const query = document.getElementById('search').value.toLowerCase();
            const list = document.getElementById('products-list');
            list.innerHTML = catalog.filter(i => i.cat === currentCategory && i.name.toLowerCase().includes(query)).map(item => `
                <div class="product-item">
                    <div><b>${item.name}</b><br><small>${item.price} ₽</small></div>
                    <div class="counter">
                        <button class="btn-count" onclick="changeQty(${item.id}, -1)">-</button>
                        <span id="qty-${item.id}">0</span>
                        <button class="btn-count add" onclick="changeQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `).join('');
        }

        function changeQty(id, delta) {
            if(!cart[id]) cart[id] = { ...catalog.find(x => x.id === id), quantity: 0 };
            cart[id].quantity += delta;
            if(cart[id].quantity < 0) cart[id].quantity = 0;
            document.getElementById(`qty-${id}`).innerText = cart[id].quantity;
            updateMainButton();
        }

        function updateMainButton() {
            let total = 0, count = 0;
            for(let i in cart) { total += cart[i].price * cart[i].quantity; count += cart[i].quantity; }
            if(count > 0) {
                tg.MainButton.text = `Отправить отчет (${total} ₽)`;
                tg.MainButton.show();
            } else { tg.MainButton.hide(); }
        }

        tg.MainButton.onClick(() => {
            const branch_id = document.getElementById('sale-branch-select').value;
            sendData("sale_report", { branch_id: parseInt(branch_id), cart });
        });

        function openShift() {
            const branch_id = document.getElementById('sale-branch-select').value;
            sendData("open_shift", { branch_id: parseInt(branch_id) });
        }

        // --- УПРАВЛЕНИЕ ДИРЕКТОРА ---
        function renderDirectorData() {
            document.getElementById('branches-list').innerHTML = branches.map(b => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:6px;">
                    <span>▪️ ${b.name}</span>
                    <button class="btn danger" style="width:auto; padding:6px 12px; margin:0;" onclick="deleteBranch(${b.id})">Удалить</button>
                </div>
            `).join('');
            document.getElementById('cfg-branch-select').innerHTML = branches.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        }

        function addBranch() {
            const name = document.getElementById('new-branch-name').value;
            if(!name) return;
            sendData("add_branch", { name });
        }

        function deleteBranch(branch_id) {
            sendData("delete_branch", { branch_id });
        }

        function toggleSalaryInputs() {
            const type = document.getElementById('cfg-type').value;
            if(type === 'fixed') {
                document.getElementById('div-fixed').classList.remove('hidden');
                document.getElementById('div-percent').classList.add('hidden');
            } else {
                document.getElementById('div-fixed').classList.add('hidden');
                document.getElementById('div-percent').classList.remove('hidden');
            }
        }

        function saveEmployeeSettings() {
            const emp_id = parseInt(document.getElementById('cfg-emp-id').value);
            const branch_id = parseInt(document.getElementById('cfg-branch-select').value);
            const salary_type = document.getElementById('cfg-type').value;
            let fixed = 0, percent = 0;
            
            if(salary_type === 'fixed') {
                fixed = parseFloat(document.getElementById('cfg-fixed').value) || 0;
            } else {
                fixed = parseFloat(document.getElementById('cfg-shift').value) || 0;
                percent = parseFloat(document.getElementById('cfg-per').value) || 0;
            }
            if(!emp_id) return alert("Введите Telegram ID сотрудника!");
            sendData("save_employee_settings", { emp_id, branch_id, salary_type, fixed, percent });
        }

        // --- РЕВИЗИЯ ---
        function initRevisionTab() {
            const revDiv = document.getElementById('revision-list');
            revDiv.innerHTML = catalog.map(item => `
                <div style="margin-bottom:10px;">
                    <label>${item.name} (Учет: ${item.stock})</label>
                    <input type="number" id="rev-item-${item.id}" value="${item.stock}">
                </div>
            `).join('');
        }

        function submitRevision() {
            let updates = {};
            catalog.forEach(item => {
                const val = document.getElementById(`rev-item-${item.id}`).value;
                updates[item.id] = parseInt(val) || 0;
            });
            sendData("revision_fact", { updates });
        }
    </script>
</body>
</html>
