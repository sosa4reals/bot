<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Vape Zilla CRM</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            var(--tg-theme-bg-color, #0f172a);
            --surface-color: var(--tg-theme-secondary-bg-color, #1e293b);
            --text-color: var(--tg-theme-text-color, #f8fafc);
            --hint-color: var(--tg-theme-hint-color, #94a3b8);
            --accent-color: var(--tg-theme-button-color, #6366f1);
            --accent-neon: #818cf8;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --glass-bg: rgba(30, 41, 59, 0.7);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0; padding: 0; user-select: none; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container { display: flex; flex-direction: column; min-height: 100vh; }
        .view-section { flex: 1; padding: 16px; padding-bottom: 100px; animation: fadeIn 0.3s ease; }
        .view-section.hidden { display: none !important; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Шапка и поиск */
        .header { 
            position: sticky; top: 0; z-index: 10; 
            padding-bottom: 12px; margin-bottom: 10px;
            background: var(--bg-color);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .search-bar {
            width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1); background: var(--surface-color);
            color: var(--text-color); font-size: 16px; outline: none; transition: border-color 0.3s ease;
        }
        .search-bar:focus { border-color: var(--accent-neon); }
        .search-bar::placeholder { color: var(--hint-color); }

        /* Категории */
        .categories { display: flex; overflow-x: auto; padding: 12px 0 4px 0; gap: 10px; scroll-behavior: smooth; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: var(--surface-color); color: var(--hint-color); border: 1px solid rgba(255,255,255,0.05);
            padding: 10px 20px; border-radius: 24px; font-size: 14px; font-weight: 500;
            white-space: nowrap; cursor: pointer; transition: all 0.2s ease;
        }
        .cat-btn.active { 
            background: linear-gradient(135deg, var(--accent-color), #4f46e5); 
            color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        /* Карточки */
        .product-item, .crm-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px; background: var(--surface-color); border-radius: 16px;
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: transform 0.2s;
        }
        .product-item:active { transform: scale(0.98); }
        .product-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; letter-spacing: 0.3px; }
        .product-price { font-size: 15px; color: var(--accent-neon); font-weight: 500; }

        /* Счетчики */
        .counter { display: flex; align-items: center; gap: 14px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 20px;}
        .btn-count {
            width: 34px; height: 34px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.1); color: var(--text-color); font-size: 20px;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s;
        }
        .btn-count:active { transform: scale(0.9); }
        .btn-count.add { background: var(--accent-color); color: #fff; }
        .count-val { font-size: 16px; font-weight: bold; min-width: 20px; text-align: center; }

        /* Навигация (Glassmorphism) */
        .nav-bar {
            position: fixed; bottom: 0; left: 0; right: 0; height: 80px;
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--hint-color); font-size: 11px; cursor: pointer; gap: 6px; font-weight: 500; transition: color 0.3s;
        }
        .nav-item.active { color: var(--accent-neon); transform: translateY(-2px); }
        .nav-icon { font-size: 22px; transition: transform 0.3s; }
        .nav-item.active .nav-icon { transform: scale(1.1); }

        /* Формы и кнопки */
        h2 { font-size: 20px; margin: 24px 0 16px 0; font-weight: 700; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--hint-color); font-weight: 500; }
        .form-input {
            width: 100%; box-sizing: border-box; padding: 16px; background: var(--surface-color);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 16px; outline: none;
            transition: border 0.3s;
        }
        .form-input:focus { border-color: var(--accent-neon); }
        
        .btn-action {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--accent-color), #4f46e5); 
            border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); transition: all 0.2s;
        }
        .btn-action:active { transform: translateY(2px); box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4); }
        .btn-action.success { background: linear-gradient(135deg, var(--success-color), #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Вкладка 1: Продажи -->
        <div id="view-sales" class="view-section">
            <div class="header">
                <input type="text" class="search-bar" id="search" placeholder="Поиск товара...">
                <div class="categories" id="categories-list"></div>
            </div>
            <div id="products-list"></div>
        </div>

        <!-- Вкладка 2: Смены и Зарплата -->
        <div id="view-salary" class="view-section hidden">
            <h2>🕒 Рабочая смена</h2>
            <div class="crm-card" style="flex-direction: column; align-items: flex-start; gap: 14px;">
                <div id="shift-status" style="font-weight: 500;">Статус смены: <span style="color: var(--hint-color)">Не открыта</span></div>
                <button class="btn-action success" id="btn-shift" onclick="sendCMD('shift_toggle')">Открыть смену</button>
            </div>
            <h2>💰 Финансы сотрудника</h2>
            <div class="crm-card"><span>Отработано смен:</span><span id="stat-shifts" style="font-weight: bold;">0</span></div>
            <div class="crm-card"><span>Процент с продаж:</span><span id="stat-percent" style="font-weight: bold;">0 ₽</span></div>
            <div class="crm-card"><span style="color: var(--success-color); font-weight: bold;">К выплате:</span><span id="stat-total" style="font-size: 18px; font-weight: bold; color: var(--success-color);">0 ₽</span></div>
        </div>

        <!-- Вкладка 3: Ревизия -->
        <div id="view-revision" class="view-section hidden">
            <h2>🔍 Проведение ревизии</h2>
            <div class="form-group">
                <label>Фактически наличных в кассе (₽)</label>
                <input type="number" class="form-input" id="rev-cash" placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Комментарий к проверке</label>
                <input type="text" class="form-input" id="rev-comment" placeholder="Например: всё в порядке">
            </div>
            <button class="btn-action" onclick="submitRevision()">Отправить отчет</button>
        </div>

        <!-- Вкладка 4: Точки -->
        <div id="view-branches" class="view-section hidden">
            <h2>🏬 Торговые точки</h2>
            <div class="form-group">
                <input type="text" class="form-input" id="new-branch-name" placeholder="Название новой точки">
            </div>
            <button class="btn-action" onclick="createBranch()">Добавить точку</button>
        </div>

        <!-- Вкладка 5: Управление -->
        <div id="view-staff" class="view-section hidden">
            <h2>👤 Управление персоналом</h2>
            <button class="btn-action success" onclick="sendCMD('excel_export')" style="margin-bottom: 16px;">📥 Экспорт каталога (Excel)</button>
            <button class="btn-action" onclick="sendCMD('excel_import')" style="background: var(--surface-color); color: var(--text-color); border: 1px solid rgba(255,255,255,0.1); box-shadow: none;">📤 Инструкция по импорту</button>
        </div>

        <!-- Меню переключения -->
        <div class="nav-bar">
            <div class="nav-item active" onclick="switchTab('sales', this)"><span class="nav-icon">🛒</span><span>Продажи</span></div>
            <div class="nav-item" onclick="switchTab('salary', this)"><span class="nav-icon">💰</span><span>Зарплата</span></div>
            <div class="nav-item" onclick="switchTab('revision', this)"><span class="nav-icon">🔍</span><span>Ревизия</span></div>
            <div class="nav-item" onclick="switchTab('branches', this)"><span class="nav-icon">🏬</span><span>Точки</span></div>
            <div class="nav-item" onclick="switchTab('staff', this)"><span class="nav-icon">⚙️</span><span>Настройки</span></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        const catalog = {
            "💧 Жидкости": { "Podonki Alfa": 500, "Podonki Critical": 500, "Mad": 500, "Vlaga": 550, "BZ": 400 },
            "🔋 Одноразки": { "Vozol Star 1800": 1800, "Vozol Rave 1800": 1800, "Lost Mary MO10000": 1200 },
            "💨 Под-устройства": { "Vaporesso Xros 5": 2800, "Vaporesso Xros Cube": 2000, "Smoant Pasito 3": 4000 },
            "⚙️ Комплектующие": { "Кар-дж Xros": 300, "Ис-р GeekVape P": 350, "Ис-р GeekVape Z": 450 }
        };

        let cart = {};
        let currentCategory = Object.keys(catalog)[0];

        const catList = document.getElementById('categories-list');
        Object.keys(catalog).forEach((cat, idx) => {
            const btn = document.createElement('button');
            btn.className = `cat-btn ${idx === 0 ? 'active' : ''}`;
            btn.innerText = cat;
            btn.onclick = () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active'); currentCategory = cat;
                document.getElementById('search').value = ''; filterProducts();
                btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            };
            catList.appendChild(btn);
        });

        const prodList = document.getElementById('products-list');
        for (const [category, products] of Object.entries(catalog)) {
            for (const [name, price] of Object.entries(products)) {
                const item = document.createElement('div');
                item.className = 'product-item p-item';
                item.dataset.category = category; item.dataset.name = name.toLowerCase();
                item.innerHTML = `
                    <div class="product-info"><div class="product-name">${name}</div><div class="product-price">${price} ₽</div></div>
                    <div class="counter">
                        <button class="btn-count hidden" onclick="changeCount('${name.replace(/'/g, "\\'")}', ${price}, -1, this)">-</button>
                        <span class="count-val hidden">0</span>
                        <button class="btn-count add" onclick="changeCount('${name.replace(/'/g, "\\'")}', ${price}, 1, this)">+</button>
                    </div>
                `;
                prodList.appendChild(item);
            }
        }

        function filterProducts() {
            const query = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('.p-item').forEach(item => {
                const sMatch = item.dataset.name.includes(query);
                const cMatch = item.dataset.category === currentCategory;
                if (query.length > 0) {
                    if (sMatch) item.classList.remove('hidden'); else item.classList.add('hidden');
                } else {
                    if (cMatch) item.classList.remove('hidden'); else item.classList.add('hidden');
                }
            });
        }
        document.getElementById('search').addEventListener('input', filterProducts);

        function changeCount(name, price, delta, btn) {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            const counterDiv = btn.parentElement;
            const minusBtn = counterDiv.children[0]; const countSpan = counterDiv.children[1];
            if (!cart[name]) cart[name] = { quantity: 0, price: price };
            cart[name].quantity += delta;
            if (cart[name].quantity <= 0) {
                delete cart[name]; countSpan.innerText = 0;
                minusBtn.classList.add('hidden'); countSpan.classList.add('hidden');
            } else {
                countSpan.innerText = cart[name].quantity;
                minusBtn.classList.remove('hidden'); countSpan.classList.remove('hidden');
            }
            updateMainButton();
        }

        function updateMainButton() {
            let total = 0, count = 0;
            for (const item of Object.values(cart)) { total += item.price * item.quantity; count += item.quantity; }
            if (count > 0 && !document.getElementById('view-sales').classList.contains('hidden')) {
                tg.MainButton.text = `Оформить продажу (${total} ₽)`; 
                tg.MainButton.color = "#6366f1"; 
                tg.MainButton.show();
            } else { tg.MainButton.hide(); }
        }

        tg.MainButton.onClick(() => {
            sendCMD("sale", cart);
        });

        // ПРАВИЛЬНАЯ ФУНКЦИЯ ОТПРАВКИ (ИСПОЛЬЗУЕТ NATIVE METHOD)
        function sendCMD(action, payload = {}) {
            const dataObj = { action: action, payload: payload };
            tg.sendData(JSON.stringify(dataObj));
        }

        function switchTab(tabId, btn) {
            if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
            document.querySelectorAll('.view-section').forEach(sec => sec.classList.add('hidden'));
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            btn.classList.add('active'); updateMainButton();
            window.scrollTo(0, 0);
        }

        function submitRevision() {
            const cash = document.getElementById('rev-cash').value;
            const comment = document.getElementById('rev-comment').value;
            sendCMD("revision", { cash: cash, comment: comment });
        }
        function createBranch() {
            const name = document.getElementById('new-branch-name').value;
            sendCMD("create_branch", { name: name });
        }

        filterProducts();
    </script>
</body>
</html>
